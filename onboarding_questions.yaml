# Onboarding questions for new users.
# id: input id in the app (keep it); question: the text shown (changing it starts a new
#   onboarding.csv, the old one is kept with a date in its name).
# type: single (one answer) or multiple (several answers); answers are chosen from
#   'choices' (or 'choice_groups', a list shown under headings): no free text, so
#   answers stay comparable. A question without choices is a text box.
# Countries: Africa, Asia, and Latin America and the Caribbean (UN M49 regions and names,
#   ISOcodes package; a few names shortened).

questions:
  - id: question_1
    question: Why are you planning to use the tool?
    type: multiple
    choices:
      - Research / ex-ante assessment
      - Project or investment planning
      - Monitoring and evaluation of interventions
      - Policy advice
      - Emissions or carbon reporting
      - Teaching or training
      - Other
  - id: question_2
    question: What specific features are you most interested in?
    type: multiple
    choices:
      - Greenhouse gas emissions
      - Land requirement
      - Water use
      - Nitrogen balance and soil health
      - Soil carbon
      - Productivity (milk, meat)
      - Comparing scenarios
      - Batch processing of many farms (survey data)
      - Other
  - id: question_3
    question: How did you hear about us?
    type: single
    choices:
      - Colleague
      - Alliance / CGIAR website or newsletter
      - Training or workshop
      - Scientific publication
      - Conference
      - Social media
      - Web search
      - Other
  - id: question_4
    question: Which livestock system(s) and value chain do you plan to assess?
    type: multiple
    choices:
      - Dairy cattle
      - Beef cattle
      - Dual-purpose cattle
      - Sheep and goats
      - Pigs
      - Buffalo
      - Mixed crop-livestock
      - Pastoral / agro-pastoral
      - Other
  - id: question_5
